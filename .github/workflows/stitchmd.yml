name: Stitch README.md

on:
  push:
    branches: [main]

  pull_request:

jobs:
  stitchmd:
    name: ${{ github.event_name == 'pull_request' && 'Update' || 'Check' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Check or update README
      uses: abhinav/stitchmd-action@ae7594a69ac0b21b6df6fd4358cb448bdd14c246 # v2
      with:
        mode: ${{ github.event_name == 'pull_request' && 'write' || 'check' }}
        summary: doc/README.md
        output: README.md

    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
      if: ${{ github.event_name == 'pull_request' }}
      with:
        file_pattern: README.md
        commit_message: 'Update README.md'
